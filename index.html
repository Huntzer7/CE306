<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แปลงสกุลเงิน</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <img src="img/money.png" class="money-img">
  <div class="page-wrapper">

    <!-- Header -->
    <div class="header">
      <div class="header-icon">💱</div>
      <h1>แปลงสกุลเงิน</h1>
      <p>อัตราแลกเปลี่ยนสกุลเงินนานาชาตินะจ๊ะ</p>
    </div>

    <!-- Converter Card -->
    <div class="converter-card">

      <!-- Rate Info + Timestamp -->
      <div class="rate-display">
        <div class="rate-info">
          <div id="rate-text">เลือกสกุลเงินเพื่อดูอัตราแลกเปลี่ยน</div>
          <div class="timestamp">อัปเดตเมื่อ: <span id="update-time">—</span></div>
        </div>
        <span class="rate-badge">อัตราจำลอง</span>
      </div>

      <!-- Currency From (amount-one) -->
      <div class="currency-field">
        <label for="amount-one">สกุลเงินต้นทาง</label>
        <div class="input-group">
          <select class="currency-select" id="currency-one">
            <option value="THB">🇹🇭 THB</option>
            <option value="USD" selected>🇺🇸 USD</option>
            <option value="EUR">🇪🇺 EUR</option>
            <option value="GBP">🇬🇧 GBP</option>
            <option value="JPY">🇯🇵 JPY</option>
            <option value="CNY">🇨🇳 CNY</option>
            <option value="KRW">🇰🇷 KRW</option>
            <option value="SGD">🇸🇬 SGD</option>
            <option value="AUD">🇦🇺 AUD</option>
            <option value="HKD">🇭🇰 HKD</option>
            <option value="MYR">🇲🇾 MYR</option>
          </select>
          <input type="number" class="amount-input" id="amount-one" placeholder="กรอกจำนวนเงิน" min="0">
        </div>
      </div>

      <!-- Swap Button -->
      <div class="swap-row">
        <button class="swap-btn" id="swap-btn" title="สลับสกุลเงิน">⇅</button>
      </div>

      <!-- Currency To (amount-two) -->
      <div class="currency-field">
        <label for="amount-two">สกุลเงินปลายทาง</label>
        <div class="input-group">
          <select class="currency-select" id="currency-two">
            <option value="THB" selected>🇹🇭 THB</option>
            <option value="USD">🇺🇸 USD</option>
            <option value="EUR">🇪🇺 EUR</option>
            <option value="GBP">🇬🇧 GBP</option>
            <option value="JPY">🇯🇵 JPY</option>
            <option value="CNY">🇨🇳 CNY</option>
            <option value="KRW">🇰🇷 KRW</option>
            <option value="SGD">🇸🇬 SGD</option>
            <option value="AUD">🇦🇺 AUD</option>
            <option value="HKD">🇭🇰 HKD</option>
            <option value="MYR">🇲🇾 MYR</option>
          </select>
          <input type="number" class="amount-input" id="amount-two" placeholder="จำนวนเงินที่แปลงแล้ว" min="0">
        </div>
      </div>

      <div class="direction-hint" id="direction-hint">
        พิมพ์ในช่องใดช่องหนึ่งเพื่อแปลงสองทิศทาง
      </div>

      <!-- Result Box -->
      <div class="result-box" id="result-box">
        <span class="result-placeholder" id="result-placeholder">ผลลัพธ์จะแสดงที่นี่</span>
        <span class="result-text" id="result-text"></span>
      </div>

      <!-- Action Buttons -->
      <div class="buttons-row">
        <button class="btn-convert" id="convert-btn">แปลงสกุลเงิน</button>
        <button class="btn-clear" id="clear-btn">ล้างข้อมูล</button>
      </div>

    </div>

    <!-- History Card -->
    <div class="history-card">
      <div class="history-header">
        <div class="history-title-group">
          <h2>ประวัติการแปลงเงิน</h2>
          <span class="history-count" id="history-count">0 รายการ</span>
        </div>
        <button class="btn-clear-history" id="clear-history-btn">ล้างประวัติ</button>
      </div>

      <div class="history-list" id="history-list">
        <div class="history-empty" id="history-empty">
          <span class="history-empty-icon">📋</span>
          ยังไม่มีประวัติการแปลง<br>ลองแปลงสกุลเงินดูสิ
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
