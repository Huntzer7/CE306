<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <title>ฝึก html</title>
        <link rel="stylesheet" href="style.css">
    </head>
    
    <body>

        <div class="container">

            <h1 id="main-title">แปลงสกุลเงิน</h1>

            <div class="card">
                <label for="amount">จำนวนเงิน</label>
                <input type="number" id="amount" placeholder="0.00">

                <label for="currency">สกุลเงิน</label>
                <select id="currency">
                    <option value="thb">THB - บาทไทย</opton>
                    <option value="usd">USD - ดอลลาร์</option>
                </select>
        
                <button type="button">ยืนยัน</button>
            </div>

        </div>

    </body>
</html>
