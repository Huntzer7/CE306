<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <title>แปลงสกุลเงิน</title>
        <link rel="stylesheet" href="style.css">
    </head>
    
    <body>

        <div class="container">

            <h1 id="main-title">แปลงสกุลเงิน</h1>

            <div class="card">
                <label for="amount">จำนวนเงิน</label>
                <input type="number" id="amount" placeholder="0.00">

                <div id="result-box" class="result-box">
                    result
                </div>

                <label for="currency">สกุลเงิน</label>
                <select id="currency">
                    <option value="thb">THB - บาทไทย</opton>
                    <option value="usd">USD - ดอลลาร์</option>
                </select>
        
                <button type="button" class="btn" id="convert-btn">
                    แปลงสกุลเงิน
                </button>

                <button type="button" class="btn btn-center" id="clear-btn">
                    ล้างข้อมูล
                </button>

            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
