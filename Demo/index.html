<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <title>แปลงสกุลเงิน</title>
        <link rel="stylesheet" href="style.css">
    </head>
    
    <body>

        <div class="container">

            <h1 id="main-title">แปลงสกุลเงิน</h1>

            <div class="history-card">
                <div class="history-header">
                    <h2>ประวัติการแปลงเงิน</h2>
                    <span id="history-count">0 รายการ</span>
                    <button type="button" id="clear-history-btn">ล้างประวัติ</button>
                </div>

                <div id="history-list">

                    <div id="history-empty">
                        ยังไม่มีประวัติการแปลงเงิน
                    </div>
                </div>
            </div>

            <div class="rate-display">
                <div class="timestamp">
                    อัปเดตเมื่อ:
                    <span id="update-time">-</span>
                </div>
            </div>

                <!--amount-one-->
                <div class="currency-field">
                    <label for="currency">สกุลเงิน</label>
                    <div class="input-group">
                        <select id="currency">
                            <option value="THB">🇹🇭 THB</option>
                            <option value="USD" selected>🇺🇸 USD</option>
                            <option value="EUR">🇪🇺 EUR</option>
                            <option value="GBP">🇬🇧 GBP</option>
                            <option value="JPY">🇯🇵 JPY</option>
                            <option value="CNY">🇨🇳 CNY</option>
                            <option value="KRW">🇰🇷 KRW</option>
                            <option value="SGD">🇸🇬 SGD</option>
                            <option value="AUD">🇦🇺 AUD</option>
                            <option value="HKD">🇭🇰 HKD</option>
                            <option value="MYR">🇲🇾 MYR</option>
                        </select>
                        <input type="number" class="amount-input" id="amount-one" placeholder="กรอกจำนวนเงิน" min="0">
                    </div>
                </div>

                <!--ปุ่ม สลับช่องทาง (swap)-->
                <div class="swap-row">
                    <button class="swap-btn" id="swap-btn" title="สลับสกุลเงิน">⇅</button>
                </div>

                <!--amount-two-->
                <div class="currency-field">
                    <label for="currency">สกุลเงิน</label>
                    <div class="input-group">
                        <select id="currency">
                            <option value="THB" selected>🇹🇭 THB</option>
                            <option value="USD">🇺🇸 USD</option>
                            <option value="EUR">🇪🇺 EUR</option>
                            <option value="GBP">🇬🇧 GBP</option>
                            <option value="JPY">🇯🇵 JPY</option>
                            <option value="CNY">🇨🇳 CNY</option>
                            <option value="KRW">🇰🇷 KRW</option>
                            <option value="SGD">🇸🇬 SGD</option>
                            <option value="AUD">🇦🇺 AUD</option>
                            <option value="HKD">🇭🇰 HKD</option>
                            <option value="MYR">🇲🇾 MYR</option>
                        </select>
                        <input type="number" class="amount-input" id="amount-two" placeholder="กรอกจำนวนเงิน" min="0">
                    </div>
                </div>

                <div id="result-box" class="result-box">
                    result
                </div>

                <div class="buttons-row">
                    <button type="button" class="btn" id="convert-btn">
                        แปลงสกุลเงิน
                    </button>

                    <button type="button" class="btn btn-center" id="clear-btn">
                        ล้างข้อมูล
                    </button>
                </div>

            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
