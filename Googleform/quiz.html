const app=document.getElementById("app");
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let S;
function home(){
 app.innerHTML=`<h1>แบบทดสอบ CE306</h1><p class="s">เลือกสัปดาห์ที่ต้องการทำ ทำซ้ำได้ไม่จำกัด สุ่มลำดับข้อทุกครั้ง</p><div class="grid">
 <button class="part all" data-p="all"><b>รวมทั้งหมด (สัปดาห์ 1–7)</b><span>${P.reduce((n,p)=>n+p[1].length,0)} ข้อ</span></button>`+
 P.map((p,i)=>`<button class="part" data-p="${i}"><b>${p[0]}</b><span>${p[1].length} ข้อ</span></button>`).join("")+`</div>`;
 app.querySelectorAll(".part").forEach(b=>b.onclick=()=>start(b.dataset.p));
}
function start(p){
 const items=p==="all"?P.flatMap(x=>x[1].map(q=>({q,w:x[0].split(":")[0]}))):P[p][1].map(q=>({q,w:""}));
 S={p,qs:shuffle(items),i:0,sc:0,wrong:[],done:false};show();
}
function show(){
 const {q:[t,o,a],w}=S.qs[S.i],n=S.qs.length;
 app.innerHTML=`<div class="top"><span>${S.p==="all"?w:P[S.p][0].split(":")[0]}</span><span>ข้อ ${S.i+1}/${n} · คะแนน ${S.sc}</span></div>
 <div class="bar"><i style="width:${S.i/n*100}%"></i></div><p class="q">${t}</p><div id="o"></div><div id="nx"></div><button class="btn g" id="qt">ออก</button>`;
 const box=document.getElementById("o");
 o.forEach((x,k)=>{const b=document.createElement("button");b.className="opt";b.textContent=L[k]+". "+x;b.onclick=()=>pick(k);box.appendChild(b)});
 document.getElementById("qt").onclick=home;
}
function pick(k){
 const {q:[t,o,a]}=S.qs[S.i];const bs=[...document.querySelectorAll(".opt")];
 bs.forEach((b,i)=>{b.disabled=true;if(i===a)b.classList.add("ok");else if(i===k)b.classList.add("no")});
 if(k===a)S.sc++;else S.wrong.push({t,you:o[k],yl:L[k],ans:o[a],al:L[a]});
 const last=S.i===S.qs.length-1,nx=document.getElementById("nx");
 nx.innerHTML=`<button class="btn">${last?"ดูคะแนน":"ข้อถัดไป"}</button>`;
 nx.firstChild.onclick=()=>{if(last)result();else{S.i++;show()}};
}
function result(){
 const n=S.qs.length,pc=Math.round(S.sc/n*100);
 app.innerHTML=`<h1>ทำเสร็จแล้ว</h1><div class="score">${S.sc} / ${n}</div><p class="s">${pc}%</p>
 <button class="btn" id="re">ทำซ้ำชุดนี้</button><button class="btn g" id="hm">กลับหน้าหลัก</button>
 ${S.wrong.length?`<h3 style="margin-top:24px">ข้อที่ตอบผิด (${S.wrong.length})</h3>`+S.wrong.map(w=>`<div class="rev"><b>${w.t}</b><br><span class="n">คุณตอบ: ${w.yl}. ${w.you}</span><br><span class="y">เฉลย: ${w.al}. ${w.ans}</span></div>`).join(""):`<p>ถูกทุกข้อ!</p>`}`;
 document.getElementById("re").onclick=()=>start(S.p);document.getElementById("hm").onclick=home;
}
home();
</script></body></html>
